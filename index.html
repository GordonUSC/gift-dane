<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light the Forest</title>
<meta name="description" content="For Dane: light the forest, then the drop.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Light the Forest">
<meta property="og:image" content="https://gordonusc.github.io/gift-dane/img/forest.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;700&display=swap">
<style>
:root{--outer:#05070f;--ink:#eef6ff;--accent:#7cf7d4;--card:#08101ff0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--outer);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{font:16px/1.4 "Outfit",system-ui,sans-serif;color:var(--ink)}
.stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100svh*9/16));overflow:hidden;background:var(--outer)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 2px 14px #000c}
.cap small{display:block;font-weight:700;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.cap h1{margin:6px 0 4px;font:400 clamp(34px,10vw,52px) "Bungee",Impact,sans-serif;line-height:1.02;text-wrap:balance}
.cap p{margin:0 auto;max-width:30ch;font-size:15px;opacity:.92}
.hud{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);text-align:center;pointer-events:none;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);text-shadow:0 2px 10px #000}
.end{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%) scale(.9);opacity:0;transition:opacity .9s,transform .9s;text-align:center;pointer-events:none;padding:22px 18px;border-radius:18px;background:var(--card);box-shadow:0 20px 60px -20px #000}
.end.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.end h2{margin:0 0 8px;font:400 clamp(24px,7vw,32px) "Bungee",Impact,sans-serif;line-height:1.08;text-wrap:balance}
.end p{margin:0;font-size:15.5px;opacity:.95}
.end button{margin-top:14px;font:700 13px "Outfit",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:9px 16px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center;font-size:11px;opacity:.7;pointer-events:none;text-shadow:0 1px 6px #000}

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg" id="bg" src="img/forest.jpg" alt="A night forest stage among cedars in the mountains">
  <canvas id="cv"></canvas>
  <div class="cap"><small>For Dane</small><h1>Light the forest</h1><p>You told Gordon he had to check out Shambhala. He did. Tap every lantern.</p></div>
  <div class="hud" id="hud">0 / 9 lanterns</div>
  
  <div class="end" id="end"><h2>Thanks for saying go.</h2><p>Gordon found a whole forest because you told him to. Here is to the next sunrise, Dane.</p><button id="again">Light it again</button></div>
  <div class="foot">made by Darby, Gordon's AI assistant, with love from Gordon</div>
</div>
<script>
// Sound: ElevenLabs files only (see PROVENANCE.json). WebAudio just plays and mixes them.
let ac=null, master=null; const bufs={}; const SND=["laser","forest","crowd","music"];
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination); SND.forEach(load);}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
async function load(n){ if(bufs[n]) return bufs[n]; try{ const r=await fetch('snd/'+n+'.mp3'); const a=await r.arrayBuffer(); bufs[n]=await new Promise((ok,no)=>ac.decodeAudioData(a,ok,no)); }catch(e){} return bufs[n]; }
async function play(n,vol=1,loop=false,rate=1){ if(!audio()) return null; const b=await load(n); if(!b) return null; const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.loop=loop; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g).connect(master); s.start(); return {s,g,t0:ac.currentTime}; }
function fade(h,t=.4){ if(!h||!ac) return; try{ h.g.gain.cancelScheduledValues(ac.currentTime); h.g.gain.setTargetAtTime(0,ac.currentTime,t/3); setTimeout(()=>{try{h.s.stop();}catch(e){}},t*1000+300); }catch(e){} }
// Canvas sized to the frame; P() maps a point in the painting (0..1) through object-fit:cover.
const cv=document.getElementById('cv'), x=cv.getContext('2d'), bg=document.getElementById('bg'), DPR=Math.min(devicePixelRatio||1,2);
let W=0,H=0; function size(){ W=cv.width=cv.clientWidth*DPR; H=cv.height=cv.clientHeight*DPR; } size(); addEventListener('resize',size);
function cover(){ const iw=bg.naturalWidth||752, ih=bg.naturalHeight||1344, s=Math.max(W/iw,H/ih); return {s,ox:(W-iw*s)/2,oy:(H-ih*s)/2,iw,ih}; }
function P(fx,fy){ const c=cover(); return [c.ox+fx*c.iw*c.s, c.oy+fy*c.ih*c.s]; }
function S(f){ const c=cover(); return f*c.iw*c.s; }
function pt(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR]; }
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id), hud=$('hud'), end=$('end');

const L=[[.2,.22],[.78,.2],[.5,.33],[.12,.41],[.88,.37],[.3,.52],[.7,.5],[.13,.63],[.88,.61]];
const lit=L.map(()=>0), beams=[], sparks=[]; let amb=null, music=null, dropT=0, done=false, nLit=0;
const HUES=[170,300,200,330,140,260,190,310,160];
cv.addEventListener('pointerdown',async e=>{ audio(); if(!amb) amb=await play('forest',.6,true);
  const [px,py]=pt(e); let best=-1,bd=1e9; L.forEach(([fx,fy],i)=>{ const [lx,ly]=P(fx,fy); const d=Math.hypot(px-lx,py-ly); if(d<bd){bd=d;best=i;} });
  if(bd<S(.12)&&!lit[best]){ lit[best]=1; nLit++; play('laser',.8,false,.9+Math.random()*.25); beams.push({i:best,t:1}); hud.textContent=nLit+' / 9 lanterns';
    if(nLit===9) startDrop(); }
  else { play('laser',.35,false,1.3); for(let k=0;k<10;k++) sparks.push({x:px,y:py,vx:(Math.random()-.5)*6*DPR,vy:(Math.random()-.8)*6*DPR,a:1,h:HUES[k%9]}); } });
async function startDrop(){ hud.textContent='here it comes'; music=await play('music',.95); if(amb) fade(amb,2); dropT=performance.now(); }
$('again').onclick=()=>{ end.classList.remove('on'); fade(music,.6); music=null; lit.fill(0); nLit=0; done=false; dropT=0; hud.textContent='0 / 9 lanterns'; };
(function loop(){ x.clearRect(0,0,W,H); const now=performance.now(); const [sx,sy]=P(.48,.77);
  const since=dropT?(now-dropT)/1000:0, dropped=dropT&&since>8, build=dropT&&!dropped?Math.min(since/8,1):0;
  if(dropped){ if(!done){ done=true; play('crowd',.9); setTimeout(()=>{ end.classList.add('on'); hud.textContent=''; },3200); }
    const pulse=.5+.5*Math.sin(now/60*Math.PI*2/ (60000/140/60));
    for(let k=0;k<12;k++){ const a=-Math.PI/2+Math.sin(now/700+k)*1.2; x.strokeStyle=`hsla(${HUES[k%9]},100%,65%,${.35+.3*Math.abs(Math.sin(now/180+k))})`; x.lineWidth=3*DPR; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+Math.cos(a)*H,sy+Math.sin(a)*H); x.stroke(); } }
  if(build){ x.fillStyle=`rgba(124,247,212,${build*.12*(.5+.5*Math.sin(now/(140-build*100)))})`; x.fillRect(0,0,W,H); }
  L.forEach(([fx,fy],i)=>{ const [lx,ly]=P(fx,fy), r=S(.028); const on=lit[i];
    const g=x.createRadialGradient(lx,ly,0,lx,ly,r*(on?4:1.6)); g.addColorStop(0,on?`hsla(${HUES[i]},100%,75%,.95)`:'rgba(255,200,120,.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.beginPath(); x.arc(lx,ly,r*(on?4:1.6),0,7); x.fill();
    x.strokeStyle=on?`hsla(${HUES[i]},100%,85%,1)`:'rgba(255,220,160,.7)'; x.lineWidth=1.5*DPR; x.beginPath(); x.arc(lx,ly,r*(on?1:.8+.15*Math.sin(now/400+i)),0,7); x.stroke(); });
  beams.forEach(b=>{ const [lx,ly]=P(...L[b.i]); x.strokeStyle=`hsla(${HUES[b.i]},100%,70%,${b.t})`; x.lineWidth=4*DPR*b.t; x.beginPath(); x.moveTo(sx,sy); x.lineTo(lx,ly); x.stroke(); b.t-=.03; });
  for(let i=beams.length-1;i>=0;i--) if(beams[i].t<=0) beams.splice(i,1);
  sparks.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.15*DPR; p.a-=.025; x.fillStyle=`hsla(${p.h},100%,75%,${Math.max(p.a,0)})`; x.fillRect(p.x,p.y,3*DPR,3*DPR); });
  for(let i=sparks.length-1;i>=0;i--) if(sparks[i].a<=0) sparks.splice(i,1);
  requestAnimationFrame(loop); })();

</script>
</body>
</html>
